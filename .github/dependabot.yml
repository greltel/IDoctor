version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "16:00"
      timezone: Europe/Athens
    cooldown:
      exclude:
        - "*"
    groups:
      abaplint:
        patterns:
          - "@abaplint/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "16:00"
      timezone: Europe/Athens
    cooldown:
      exclude:
        - "*"
